name: Publish Frozen Release Artifact

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact tested candidate commit
        required: true
        type: string
      artifact_run_id:
        description: Successful CI run containing authoritative-distributions
        required: true
        type: string
      artifact_name:
        description: Frozen Actions artifact name
        required: true
        default: authoritative-distributions
        type: string
      release_tag:
        description: Existing release/tag created by the program publisher
        required: true
        type: string
      wheel_sha256:
        description: Expected lowercase SHA-256 of the exact wheel
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.artifact_name }}
          path: dist
      - name: Verify frozen provenance, commit, version, and wheel SHA
        env:
          EXPECTED_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          VERSION="$(python -c 'import runpy; print(runpy.run_path("src/simple_harness/version.py")["__version__"])')"
          test "$RELEASE_TAG" = "v$VERSION"
          python scripts/build/authoritative_provenance.py verify \
            --dist dist \
            --source-commit "$EXPECTED_COMMIT" \
            --version "$VERSION"
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          test "$(sha256sum "$WHEEL" | awk '{print $1}')" = "$EXPECTED_WHEEL_SHA256"
          uv venv .release-venv --python 3.11
          uv pip install --python .release-venv/bin/python "$WHEEL"
          .release-venv/bin/python -I -c "import simple_harness; assert simple_harness.__version__ == '$VERSION'"
      - name: Upload original bytes to the existing program release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/BUILD_INFO.txt
