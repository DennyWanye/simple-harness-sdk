name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Build distributions once
        env:
          SOURCE_DATE_EPOCH: "0"
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install exact built wheel
        run: |
          uv venv .artifact-venv --python 3.11
          uv pip install --python .artifact-venv/bin/python dist/*.whl
          .artifact-venv/bin/python -I -c 'import runpy, simple_harness; expected = runpy.run_path("src/simple_harness/version.py")["__version__"]; assert simple_harness.__version__ == expected'
      - name: Run full test suite
        run: uv run --frozen --group dev pytest -q
      - name: Lint (scoped ruff)
        run: uv run --frozen --group dev ruff check src/simple_harness/runtime/consumer_adapter.py src/simple_harness/runtime/ports.py src/simple_harness/execution/delivery.py src/simple_harness/testing/sinks.py src/simple_harness/testing/__init__.py
      - name: Type check (scoped mypy)
        run: uv run --frozen --group dev mypy
      - name: Verify source provenance and REUSE compliance
        run: |
          uv run --frozen python scripts/check_source_provenance.py
          uv run --frozen reuse lint
