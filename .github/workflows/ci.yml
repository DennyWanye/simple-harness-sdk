name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Build distributions once
        env:
          SOURCE_DATE_EPOCH: "0"
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install exact built wheel
        run: |
          uv venv .artifact-venv --python 3.11
          uv pip install --python .artifact-venv/bin/python dist/*.whl
          .artifact-venv/bin/python -I -c 'import simple_harness; assert simple_harness.__version__ == "0.1.0"'
      - name: Run artifact tests
        run: uv run --frozen --group dev pytest -q tests/artifact

